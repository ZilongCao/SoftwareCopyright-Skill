name: Software Copyright Skill Tests

on:
  push:
    paths:
      - "software-copyright-materials/**"
      - ".github/workflows/skill-tests.yml"
  pull_request:
    paths:
      - "software-copyright-materials/**"
      - ".github/workflows/skill-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scripts
        run: python -m compileall -q software-copyright-materials/scripts
      - name: Run skill tests
        run: python -m unittest discover -s software-copyright-materials/tests -v
